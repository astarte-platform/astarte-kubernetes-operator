- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --metrics-bind-address=:8443

- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --metrics-secure=true

- op: add
  path: /spec/template/spec/containers/0/ports/-
  value:
    containerPort: 8443
    name: metrics
    protocol: TCP
