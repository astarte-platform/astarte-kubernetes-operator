# Default values for astarte-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- The number of Astarte Operator replicas in your cluster.
replicaCount: 1

# -- Whether or not to install Astarte CRDs.
installCRDs: true

image:
  repository: astarte/astarte-kubernetes-operator
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: "26.7.0-rc.4"

# -- Resources to assign to each Astarte Operator instance.
resources:
  limits:
    cpu: 100m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# -- Metrics configuration.
# Metrics are exposed on the configured port. When enabled, they use HTTPS by default.
metrics:
  # -- Whether to enable the metrics endpoint.
  enable: false
  # -- The port to expose metrics on.
  port: 8443
  # -- Whether to serve metrics over HTTPS. Set to false to use HTTP.
  secure: true
